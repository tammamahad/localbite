services:
  - type: web
    name: localbite-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed_demo_data && python -m app.create_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: localbite-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://your-netlify-site.netlify.app
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.netlify\.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@localbite.com
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: localbite-db
